<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Quest</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #17181a;
    --muted: #6b7078;
    --border: #e4e6e9;
    --accent: #17181a;
    --soft: #f0f1f3;
    --success: #1f7a4d;
    --gold: #b67a00;
    --shadow: 0 8px 24px rgba(0,0,0,.06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .app {
    width: min(760px, 100%);
    margin: 0 auto;
    padding: 18px 14px 40px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .brand {
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -.6px;
  }
  .date { color: var(--muted); font-size: 12px; text-align: right; }
  .hero {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 12px;
  }
  .level-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .level {
    font-size: 20px;
    font-weight: 900;
  }
  .xp { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .streak {
    text-align: right;
    font-weight: 900;
    font-size: 14px;
  }
  .streak span { display:block; font-size: 28px; line-height: 1; margin-top: 4px; }
  .progress {
    height: 12px;
    background: var(--soft);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: inherit;
    transition: width .25s ease;
  }
  .daily {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .daily-top {
    display:flex; justify-content:space-between; gap:10px;
    font-size: 13px; font-weight: 800;
  }
  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 12px;
  }
  .section h2 {
    margin: 0 0 12px;
    font-size: 16px;
  }
  .subjects {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 9px;
  }
  .subject {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 14px;
    padding: 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    text-align:left;
    min-height: 56px;
  }
  .subject:hover { background: var(--soft); }
  .subject-name { font-weight: 750; font-size: 14px; }
  .subject-total { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .plus { font-size: 20px; font-weight: 900; }
  .today-list { display:grid; gap:7px; }
  .today-row, .total-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .today-row:last-child, .total-row:last-child { border-bottom:0; }
  .today-row strong { font-size: 14px; }
  .today-row span { font-weight: 800; }
  .empty { color:var(--muted); font-size:13px; padding:5px 0; }
  .achievements {
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .badge {
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 76px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#fff;
  }
  .badge.locked { opacity:.35; filter:grayscale(1); }
  .badge .symbol { font-size: 24px; }
  .badge .name { font-size: 10px; font-weight:800; margin-top:4px; }
  .badge .req { font-size: 9px; color:var(--muted); margin-top:2px; }
  .total-big {
    font-size: 32px;
    font-weight: 950;
    letter-spacing:-1px;
  }
  .total-label { color:var(--muted); font-size:12px; }
  .modal-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    display:none; align-items:flex-end; justify-content:center;
    z-index:10;
  }
  .modal-backdrop.show { display:flex; }
  .modal {
    width:min(760px,100%);
    background:#fff;
    border-radius:22px 22px 0 0;
    padding:20px;
    box-shadow:0 -10px 40px rgba(0,0,0,.15);
  }
  .modal-head {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-bottom:16px;
  }
  .modal-title { font-size:20px; font-weight:900; }
  .close {
    border:0; background:var(--soft); border-radius:50%;
    width:38px; height:38px; font-size:20px;
  }
  .field { display:flex; gap:10px; align-items:center; }
  .field input {
    width:100%; border:1px solid var(--border); border-radius:12px;
    padding:13px; font-size:18px; outline:none;
  }
  .field input:focus { border-color:#999; }
  .save {
    width:100%; margin-top:14px; padding:14px;
    border:0; border-radius:13px; background:var(--accent); color:#fff;
    font-weight:900;
  }
  .toast {
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:#17181a; color:#fff; padding:11px 15px; border-radius:999px;
    font-size:13px; font-weight:800; opacity:0; pointer-events:none;
    transition:.25s; z-index:20;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .small-note { color:var(--muted); font-size:11px; margin-top:8px; }
  @media (max-width:520px) {
    .subjects { grid-template-columns: 1fr; }
    .achievements { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">⚔️ SSC Quest</div>
    <div class="date" id="date"></div>
  </header>

  <section class="hero">
    <div class="level-row">
      <div>
        <div class="level" id="levelText">🥚 Level 1 — Rookie</div>
        <div class="xp" id="xpText">0 / 5,000 XP</div>
      </div>
      <div class="streak">🔥 STREAK<span id="streak">0</span><small>days</small></div>
    </div>
    <div class="progress"><div id="levelBar"></div></div>

    <div class="daily">
      <div class="daily-top">
        <span>🎯 TODAY</span>
        <span id="dailyText">0 / 100 questions</span>
      </div>
      <div class="progress"><div id="dailyBar"></div></div>
    </div>
  </section>

  <section class="section">
    <h2>➕ Add Questions</h2>
    <div class="subjects" id="subjects"></div>
  </section>

  <section class="section">
    <h2>📅 Today's Questions</h2>
    <div class="today-list" id="todayList"></div>
  </section>

  <section class="section">
    <h2>📊 Subject Totals</h2>
    <div id="totalsList"></div>
  </section>

  <section class="section">
    <h2>🏅 Achievements</h2>
    <div class="achievements" id="achievements"></div>
  </section>

  <section class="section">
    <div class="total-label">TOTAL QUESTIONS</div>
    <div class="total-big" id="totalQuestions">0</div>
    <div class="small-note">1 question = 10 XP</div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Add Questions</div>
      <button class="close" id="closeModal">×</button>
    </div>
    <div class="field">
      <input id="questionInput" type="number" min="1" inputmode="numeric" placeholder="How many questions?">
    </div>
    <button class="save" id="saveBtn">ADD QUESTIONS</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUBJECTS = [
  ["maths","📐 Maths"], ["english","📚 English"], ["reasoning","🧠 Reasoning"],
  ["geography","🌍 Geography"], ["history","🏛️ History"], ["economics","💰 Economics"],
  ["polity","⚖️ Polity"], ["physics","⚛️ Physics"], ["chemistry","🧪 Chemistry"],
  ["biology","🧬 Biology"], ["environment","🌱 Environment & Ecology"],
  ["scienceTech","🔬 Science & Technology"], ["staticGK","📖 Static GK"],
  ["currentAffairs","📰 Current Affairs"]
];

const LEVELS = [
  [0, "🥚 Rookie"],
  [5000, "⚔️ Grinder"],
  [15000, "🔥 Warrior"],
  [30000, "💀 Beast"],
  [50000, "👑 Pro"],
  [80000, "🏆 Elite"],
  [120000, "⚡ Master"],
  [200000, "🐐 Legend"]
];

const BADGES = [
  [1, "①", "First Blood"],
  [500, "②", "Getting Started"],
  [1000, "③", "Grinder"],
  [2500, "④", "Warrior"],
  [5000, "⑤", "Beast"],
  [8000, "⑥", "Elite"],
  [10000, "⑦", "Master"],
  [15000, "⑧", "Titan"],
  [20000, "⑨", "Legend"]
];

const KEY = "sscQuestV1";
let state = loadState();
let selectedSubject = null;

function defaultState() {
  const totals = {};
  SUBJECTS.forEach(([id]) => totals[id] = 0);
  return { totals, days: {}, xp: 0 };
}
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (!saved) return defaultState();
    const fresh = defaultState();
    return {...fresh, ...saved, totals:{...fresh.totals, ...(saved.totals||{})}, days:saved.days||{}};
  } catch(e) { return defaultState(); }
}
function saveState() { localStorage.setItem(KEY, JSON.stringify(state)); }
function dateKey(d=new Date()) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayData() {
  const k=dateKey();
  if (!state.days[k]) state.days[k] = {total:0, subjects:{}};
  return state.days[k];
}
function totalQuestions() {
  return Object.values(state.totals).reduce((a,b)=>a+b,0);
}
function currentLevel(xp) {
  let idx=0;
  for(let i=0;i<LEVELS.length;i++) if(xp>=LEVELS[i][0]) idx=i;
  return idx;
}
function streakCount() {
  let count=0, d=new Date();
  const today=dateKey(d);
  if (!state.days[today] || state.days[today].total < 1) d.setDate(d.getDate()-1);
  while(state.days[dateKey(d)] && state.days[dateKey(d)].total > 0) {
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function format(n) { return n.toLocaleString("en-IN"); }

function render() {
  const today=todayData();
  const total=totalQuestions();
  state.xp=total*10;

  const li=currentLevel(state.xp);
  const [threshold,name]=LEVELS[li];
  const next=LEVELS[li+1];
  document.getElementById("levelText").textContent=`${name.replace(/^.*? /,"")} Level ${li+1} — ${name.split(" ").slice(1).join(" ")}`;
  document.getElementById("xpText").textContent = next
    ? `${format(state.xp)} / ${format(next[0])} XP`
    : `${format(state.xp)} XP — MAX LEVEL`;
  const levelStart=threshold;
  const levelEnd=next ? next[0] : threshold;
  const pct=next ? Math.min(100,Math.max(0,((state.xp-levelStart)/(levelEnd-levelStart))*100)) : 100;
  document.getElementById("levelBar").style.width=pct+"%";

  document.getElementById("streak").textContent=streakCount();
  document.getElementById("dailyText").textContent=`${format(today.total)} / 100 questions`;
  document.getElementById("dailyBar").style.width=Math.min(100,today.total)+"%";
  document.getElementById("totalQuestions").textContent=format(total);

  const subjectWrap=document.getElementById("subjects");
  subjectWrap.innerHTML="";
  SUBJECTS.forEach(([id,label])=>{
    const btn=document.createElement("button");
    btn.className="subject";
    btn.innerHTML=`<div><div class="subject-name">${label}</div><div class="subject-total">${format(state.totals[id])} total</div></div><div class="plus">+</div>`;
    btn.onclick=()=>openModal(id,label);
    subjectWrap.appendChild(btn);
  });

  const todayList=document.getElementById("todayList");
  const active=SUBJECTS.filter(([id])=>(today.subjects[id]||0)>0);
  todayList.innerHTML=active.length ? active.map(([id,label])=>`<div class="today-row"><strong>${label}</strong><span>+${format(today.subjects[id])}</span></div>`).join("") : `<div class="empty">No questions added today yet.</div>`;

  document.getElementById("totalsList").innerHTML=SUBJECTS.map(([id,label])=>`<div class="total-row"><span>${label}</span><strong>${format(state.totals[id])}</strong></div>`).join("");

  document.getElementById("achievements").innerHTML=BADGES.map(([req,symbol,name])=>{
    const unlocked=total>=req;
    return `<div class="badge ${unlocked?"":"locked"}"><div class="symbol">${unlocked?symbol:"🔒"}</div><div class="name">${name}</div><div class="req">${format(req)} Q</div></div>`;
  }).join("");

  saveState();
}

function openModal(id,label) {
  selectedSubject=id;
  document.getElementById("modalTitle").textContent=`${label} — Add Questions`;
  document.getElementById("questionInput").value="";
  document.getElementById("modalBackdrop").classList.add("show");
  setTimeout(()=>document.getElementById("questionInput").focus(),50);
}
function closeModal() {
  selectedSubject=null;
  document.getElementById("modalBackdrop").classList.remove("show");
}
function showToast(msg) {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

document.getElementById("saveBtn").onclick=()=>{
  const n=Math.floor(Number(document.getElementById("questionInput").value));
  if (!selectedSubject || !Number.isFinite(n) || n<1) return;
  const today=todayData();
  state.totals[selectedSubject]+=n;
  today.subjects[selectedSubject]=(today.subjects[selectedSubject]||0)+n;
  today.total+=n;
  saveState();
  closeModal();
  render();
  showToast(`+${format(n)} questions • +${format(n*10)} XP`);
};
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("modalBackdrop").onclick=e=>{ if(e.target.id==="modalBackdrop") closeModal(); };
document.getElementById("questionInput").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("saveBtn").click(); });

document.getElementById("date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
render();
</script>
</body>
</html>
